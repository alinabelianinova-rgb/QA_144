<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Hello World</title>
    <style>
        h1 {
            color: red;
            background-color: peachpuff;
            border: 2px solid black;
        }
    </style>

<link rel="stylesheet" href="style.css">

</head>

<body>
    <h1>My homework 15</h1>
    <h2 style="color:green;">Перевірка inline-стилю </h2>
    
    <p>Практична робота з HTML та CSS</p>

     <form class="registration-form" action="#" method="POST" 
          style="display: flex; justify-content: flex-end; align-items: center; gap: 15px; width: 100%;">
        
        <!-- Поле Email -->
        <div class="form-group" style="display: flex; align-items: center; gap: 8px;">
            <label for="email" style="font-weight: bold; white-space: nowrap;">Email:</label>
            <input type="email" id="email" name="email" required placeholder="example@mail.com" 
                   style="padding: 10px; border: 1px solid #ccc; border-radius: 4px; width: 200px;">
        </div>

        <!-- Поле Пароль -->
        <div class="form-group" style="display: flex; align-items: center; gap: 8px;">
            <label for="password" style="font-weight: bold; white-space: nowrap;">Пароль:</label>
            <input type="password" id="password" name="password" required placeholder="Введіть пароль" 
                   style="padding: 10px; border: 1px solid #ccc; border-radius: 4px; width: 200px;">
        </div>

        <!-- Кнопка відправки -->
        <button type="submit" class="btn-submit">Зареєструватись</button>
        </button>
    </form>




</body>
</html>
